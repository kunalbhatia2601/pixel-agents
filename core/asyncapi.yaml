# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
        # Projects + tasks (cmpAgent)
        - $ref: '#/components/schemas/ProjectsLoaded'
        - $ref: '#/components/schemas/TasksLoaded'
        - $ref: '#/components/schemas/PermissionAsked'
        - $ref: '#/components/schemas/PermissionResolved'
        - $ref: '#/components/schemas/ActionError'
        - $ref: '#/components/schemas/AgentDefaultsLoaded'
        - $ref: '#/components/schemas/AgentChat'
        - $ref: '#/components/schemas/FolderPicked'
        - $ref: '#/components/schemas/BranchesListed'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/RequestDiagnostics'
        - $ref: '#/components/schemas/SaveProject'
        - $ref: '#/components/schemas/DeleteProject'
        - $ref: '#/components/schemas/StartTask'
        - $ref: '#/components/schemas/StopTask'
        - $ref: '#/components/schemas/AnswerPermission'
        - $ref: '#/components/schemas/SaveAgentDefaults'
        - $ref: '#/components/schemas/WatchAgentChat'
        - $ref: '#/components/schemas/UnwatchAgentChat'
        - $ref: '#/components/schemas/SendAgentMessage'
        - $ref: '#/components/schemas/InterruptAgent'
        - $ref: '#/components/schemas/PickFolder'
        - $ref: '#/components/schemas/ListBranches'
        - $ref: '#/components/schemas/SetAgentMode'
        - $ref: '#/components/schemas/CompleteTask'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - ghostHeadlessAgents
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
        - showAreas
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        ghostHeadlessAgents:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, settings toggle, uninstall).
      type: object
      additionalProperties: false
      required: [type, providerId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the provider it asked about.
        installed:
          type: boolean

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the hooks preference is on, consent has not
        been recorded, and nothing of ours is installed — and, in standalone, only
        on privileged (tokened) connections, since an untokened spectator could not
        act on it anyway (its `hooksConsentResponse` would be ignored).

        Carries the provider being asked about and its disclosure copy so the
        client renders the server's exact terms (the provider's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId;
        dismissing the dialog sends nothing and the request fires again on the
        next connect. One request per provider that needs an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, headline, disclosure]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose install is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.

    AreaMappingsLoaded:
      description: |
        Workspace-folder-to-Area mappings. Folder names map to one or more Area
        labels; new agents from that folder prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of folder name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    WorkspaceFolders:
      description: Multi-root workspace folders (VS Code only).
      type: object
      additionalProperties: false
      required: [type, folders]
      properties:
        type:
          const: workspaceFolders
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFolder'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        folderPath:
          type: string
          description: Workspace folder path (for multi-root workspaces).
        bypassPermissions:
          type: boolean

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetGhostHeadlessAgents:
      description: >-
        Toggle translucent rendering for headless agents (adopted sessions with no
        terminal to focus).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setGhostHeadlessAgents
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setHooksEnabled
        providerId:
          type: string
          description: >-
            The hook provider being toggled (HookProvider.id). The client
            echoes the id of the hooksStatus row the checkbox renders; it
            never originates one.
        enabled:
          type: boolean

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists hooks-off (uninstalling first
        when this provider's hooks are on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger. The server ignores this
        message on unprivileged standalone connections, which were never sent
        the request.
      type: object
      additionalProperties: false
      required: [type, providerId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SaveAreaMappings:
      description: Persist folder-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    # ── Projects + tasks (cmpAgent) ─────────────────────────────────

    ProjectsLoaded:
      description: Saved projects in the Project Room (~/.pixel-agents/projects/).
      type: object
      additionalProperties: false
      required: [type, projects]
      properties:
        type:
          const: projectsLoaded
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    TasksLoaded:
      description: Every task the server knows about, newest first.
      type: object
      additionalProperties: false
      required: [type, tasks]
      properties:
        type:
          const: tasksLoaded
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    PermissionAsked:
      description: A task's agent wants to run a tool that needs approval.
      type: object
      additionalProperties: false
      required: [type, requestId, taskId, taskTitle, toolName, detail]
      properties:
        type:
          const: permissionAsked
        requestId:
          type: string
        taskId:
          type: string
        taskTitle:
          type: string
        toolName:
          type: string
        detail:
          type: string
          description: Tool input rendered for a human (command, path, ...).
        agentId:
          type: integer
          description: The office agent asking, when known. Its chat shows the request.
        questions:
          type: array
          description: Present when the agent asks the user to choose (AskUserQuestion).
          items:
            $ref: '#/components/schemas/AgentQuestion'

    PermissionResolved:
      description: A permission request was answered or abandoned.
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: permissionResolved
        requestId:
          type: string

    ActionError:
      description: A project/task request failed; shown to the user.
      type: object
      additionalProperties: false
      required: [type, message]
      properties:
        type:
          const: actionError
        message:
          type: string

    SaveProject:
      description: Create (empty id) or update a project. Privileged.
      type: object
      additionalProperties: false
      required: [type, project]
      properties:
        type:
          const: saveProject
        project:
          $ref: '#/components/schemas/Project'

    DeleteProject:
      description: Delete a project's record (never its repo). Privileged.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: deleteProject
        id:
          type: string

    StartTask:
      description: Start an agent on a task in a fresh worktree of the project. Privileged.
      type: object
      additionalProperties: false
      required: [type, projectId, title, prompt]
      properties:
        type:
          const: startTask
        projectId:
          type: string
        title:
          type: string
        prompt:
          type: string
        agent:
          $ref: '#/components/schemas/AgentSettings'
        baseBranches:
          type: object
          description: Repo name -> branch to start from (any local or remote branch). Missing = the repo's default branch.
          additionalProperties:
            type: string
        fromTaskId:
          type: string
          description: Branching from this task (New branch from here); recorded as parentTaskId.
        branchMode:
          $ref: '#/components/schemas/BranchMode'
        carryContext:
          type: boolean
          description: With fromTaskId, the new agent starts as a copy of that task's conversation.

    StopTask:
      description: Abort a running task's agent. Privileged.
      type: object
      additionalProperties: false
      required: [type, taskId]
      properties:
        type:
          const: stopTask
        taskId:
          type: string

    AnswerPermission:
      description: Approve or deny a pending permission request. Privileged.
      type: object
      additionalProperties: false
      required: [type, requestId, allow]
      properties:
        type:
          const: answerPermission
        requestId:
          type: string
        allow:
          type: boolean
        message:
          type: string
          description: Why it was rejected; passed to the agent.
        answers:
          type: object
          description: 'Answers to questions: question text -> chosen label(s), comma-separated.'
          additionalProperties:
            type: string
        mode:
          $ref: '#/components/schemas/PermissionMode'

    Project:
      description: A workspace of one or more repos (like a VS Code multi-root workspace).
      type: object
      additionalProperties: false
      required: [id, name, repos]
      properties:
        id:
          type: string
        name:
          type: string
        repos:
          type: array
          items:
            $ref: '#/components/schemas/ProjectRepo'
        dir:
          type: string
          description: Server-filled. The project's folder holding docs/ and memory/.
        maxReviewRounds:
          type: number
          description: Automatic QA rounds per task before escalating to the owner (default 3; 0 = no review).
        agent:
          $ref: '#/components/schemas/AgentSettings'

    AgentQuestion:
      type: object
      additionalProperties: false
      required: [question, header, multiSelect, options]
      properties:
        question:
          type: string
        header:
          type: string
        multiSelect:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/AgentQuestionOption'

    AgentQuestionOption:
      type: object
      additionalProperties: false
      required: [label, description]
      properties:
        label:
          type: string
        description:
          type: string
        preview:
          type: string

    AgentSettings:
      description: Model and reasoning settings. Empty fields inherit (defaults -> project -> task).
      type: object
      additionalProperties: false
      properties:
        model:
          type: string
          description: Alias (opus, sonnet, haiku, fable) or full model id.
        effort:
          $ref: '#/components/schemas/EffortLevel'
        thinking:
          $ref: '#/components/schemas/ThinkingMode'
        permissionMode:
          $ref: '#/components/schemas/PermissionMode'

    EffortLevel:
      type: string
      enum: [low, medium, high, xhigh, max]

    PermissionMode:
      description: >-
        How the agent's tool use is approved. default = ask for risky actions, acceptEdits = file edits
        run unasked, plan = read and plan only until a plan is approved, auto = a classifier approves or
        denies, dontAsk = anything not pre-approved is denied, bypassPermissions = no checks.
      type: string
      enum: [default, acceptEdits, plan, auto, dontAsk, bypassPermissions]

    ThinkingMode:
      type: string
      enum: [adaptive, disabled]

    ChatEntryKind:
      type: string
      enum: [user, assistant, thinking, tool, toolResult]

    ChatEntry:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          $ref: '#/components/schemas/ChatEntryKind'
        text:
          type: string
        toolName:
          type: string
        ts:
          type: string

    AgentDefaultsLoaded:
      description: Global agent settings every task starts from.
      type: object
      additionalProperties: false
      required: [type, defaults]
      properties:
        type:
          const: agentDefaultsLoaded
        defaults:
          $ref: '#/components/schemas/AgentSettings'
        reviewer:
          $ref: '#/components/schemas/AgentSettings'

    AgentChat:
      description: Conversation entries for a watched agent; reset=true replaces, false appends.
      type: object
      additionalProperties: false
      required: [type, entries, reset, controllable]
      properties:
        type:
          const: agentChat
        id:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ChatEntry'
        reset:
          type: boolean
        controllable:
          type: boolean
          description: True for task agents this server runs (messages + interrupt allowed).
        taskId:
          type: string
          description: The task this agent ran, if any; its usage and changes are authoritative.
        reviewer:
          type: boolean
          description: The chat is the task's QA reviewer, not its dev agent.
        usage:
          $ref: '#/components/schemas/UsageTotals'

    CompleteTask:
      description: The owner is done with a desk task. Ends its session and removes its worktrees; branches are kept. Privileged.
      type: object
      additionalProperties: false
      required: [type, taskId]
      properties:
        type:
          const: completeTask
        taskId:
          type: string

    SetAgentMode:
      description: Switch a task agent's permission mode, live if it is running. Privileged.
      type: object
      additionalProperties: false
      required: [type, mode]
      properties:
        type:
          const: setAgentMode
        id:
          type: integer
        taskId:
          type: string
        mode:
          $ref: '#/components/schemas/PermissionMode'

    ListBranches:
      description: Fetch every remote of each project repo, then list its branches. Privileged.
      type: object
      additionalProperties: false
      required: [type, requestId, projectId]
      properties:
        type:
          const: listBranches
        requestId:
          type: string
        projectId:
          type: string

    BranchesListed:
      type: object
      additionalProperties: false
      required: [type, requestId, repos]
      properties:
        type:
          const: branchesListed
        requestId:
          type: string
        repos:
          type: array
          items:
            $ref: '#/components/schemas/RepoBranches'

    RepoBranches:
      type: object
      additionalProperties: false
      required: [repo, branches]
      properties:
        repo:
          type: string
        branches:
          type: array
          description: Local and remote branches, most recently committed first.
          items:
            type: string
        fetchError:
          type: string
          description: Set when fetching failed; the list is then what was known locally.

    PickFolder:
      description: Open the native folder dialog on the server's machine. Privileged.
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: pickFolder
        requestId:
          type: string

    FolderPicked:
      description: Result of pickFolder; no path when cancelled.
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: folderPicked
        requestId:
          type: string
        path:
          type: string

    SaveAgentDefaults:
      description: Replace the global agent settings. Privileged.
      type: object
      additionalProperties: false
      required: [type, defaults]
      properties:
        type:
          const: saveAgentDefaults
        defaults:
          $ref: '#/components/schemas/AgentSettings'
        reviewer:
          $ref: '#/components/schemas/AgentSettings'

    WatchAgentChat:
      description: Start streaming an agent's conversation to this client. Privileged.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: watchAgentChat
        id:
          type: integer
        taskId:
          type: string
          description: Address the chat by task instead of office agent id.

    UnwatchAgentChat:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: unwatchAgentChat
        id:
          type: integer
        taskId:
          type: string
          description: Address the chat by task instead of office agent id.

    SendAgentMessage:
      description: Send a follow-up message to a task agent. Privileged.
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          const: sendAgentMessage
        id:
          type: integer
        taskId:
          type: string
          description: Address the chat by task instead of office agent id.
        text:
          type: string

    InterruptAgent:
      description: Stop a task agent's current turn; the session stays open. Privileged.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: interruptAgent
        id:
          type: integer
        taskId:
          type: string
          description: Address the chat by task instead of office agent id.

    UsageTotals:
      description: Token and cost totals. costUsd is an estimate; absent when unknown.
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens]
      properties:
        costUsd:
          type: number
        inputTokens:
          type: number
        outputTokens:
          type: number
        cacheReadTokens:
          type: number
        cacheWriteTokens:
          type: number

    CodeChanges:
      description: Diff totals against the commit the task started from.
      type: object
      additionalProperties: false
      required: [files, added, removed]
      properties:
        files:
          type: number
        added:
          type: number
        removed:
          type: number

    ChangedFile:
      type: object
      additionalProperties: false
      required: [path, added, removed]
      properties:
        path:
          type: string
        added:
          type: number
        removed:
          type: number

    BranchMode:
      description: auto = a small model decides whether the task changes code (branch) or not (read-only in the checkout).
      type: string
      enum: [auto, branch, none]

    RepoHandoff:
      type: object
      additionalProperties: false
      required: [repo, branch, baseBranch, pushCommand]
      properties:
        repo:
          type: string
        branch:
          type: string
        baseBranch:
          type: string
          description: The branch the task started from (the PR target).
        repoUrl:
          type: string
          description: Web page of the repo (credentials stripped); absent for unknown hosts.
        branchUrl:
          type: string
        createPrUrl:
          type: string
          description: The host's own "new pull request" page, prefilled. Nothing is created automatically.
        pushCommand:
          type: string
        worktree:
          type: string
        commits:
          type: number
          description: Commits on the branch since it started.

    TaskStatus:
      description: The dev agent's lifecycle. queued = waiting for one of the Dev Team's seats.
      type: string
      enum: [queued, preparing, running, done, failed, stopped]

    TaskStage:
      description: >-
        Where the task is in the review loop (absent = no review yet). review_queued = on the QA pile,
        reviewing = a QA agent is on it, changes_requested = the dev is fixing review comments,
        approved = ready for the owner, escalated = needs the owner (round limit, no progress, or review failure),
        ready = committed work with QA turned off, delivered = the owner marked it done (off the desk, worktrees removed).
      type: string
      enum: [review_queued, reviewing, changes_requested, approved, escalated, ready, delivered]

    ReviewSeverity:
      type: string
      enum: [blocker, major, minor, nit]

    ReviewComment:
      type: object
      additionalProperties: false
      required: [severity, title, detail]
      properties:
        severity:
          $ref: '#/components/schemas/ReviewSeverity'
        title:
          type: string
        detail:
          type: string
        file:
          type: string
        line:
          type: number
        suggestion:
          type: string

    ReviewRecord:
      description: One QA round. error is set when the review itself failed.
      type: object
      additionalProperties: false
      required: [round, at]
      properties:
        round:
          type: number
        at:
          type: number
        approved:
          type: boolean
        summary:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ReviewComment'
        testsRun:
          type: array
          items:
            type: string
        error:
          type: string

    ProjectRepo:
      description: One repo of a project; each task gets a worktree of it in a folder named `name`.
      type: object
      additionalProperties: false
      required: [name, path, defaultBranch]
      properties:
        name:
          type: string
          description: Folder name inside the task's workspace (e.g. frontend).
        path:
          type: string
        defaultBranch:
          type: string
        setupCommand:
          type: string
          description: Run in the repo's new worktree before the agent starts (e.g. npm ci).
        testCommand:
          type: string
          description: How to verify changes in this repo; given to the agent.

    Task:
      type: object
      additionalProperties: false
      required: [id, projectId, title, status, createdAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        branch:
          type: string
        worktree:
          type: string
          description: The agent's working folder (the repo worktree, or the folder holding one per repo).
        error:
          type: string
        createdAt:
          type: number
        agent:
          $ref: '#/components/schemas/AgentSettings'
        sessionOpen:
          type: boolean
          description: The agent process is alive and accepts follow-up messages.
        prompt:
          type: string
          description: The original instructions (the reviewer checks the work against them).
        summary:
          type: string
          description: The dev agent's latest reply (its summary of the work).
        handoff:
          type: array
          description: Per repo, everything the owner needs to take the branch from here (filled once it reaches the desk).
          items:
            $ref: '#/components/schemas/RepoHandoff'
        stage:
          $ref: '#/components/schemas/TaskStage'
        maxReviewRounds:
          type: number
          description: Automatic review rounds before escalating to the owner; 0 = no review.
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewRecord'
        reviewUsage:
          $ref: '#/components/schemas/UsageTotals'
        reviewSessionIds:
          type: array
          description: Claude sessions of this task's QA agents (their chats are read-only).
          items:
            type: string
        sessionId:
          type: string
          description: Claude session id of the task's agent; links office agents to tasks.
        parentTaskId:
          type: string
          description: The task this one branched from (New branch from here).
        readOnly:
          type: boolean
          description: No branch was cut; the agent works read-only in the user's own checkout.
        baseCommits:
          type: object
          description: Repo name -> commit the task's worktree started from; code changes are measured against it.
          additionalProperties:
            type: string
        usage:
          $ref: '#/components/schemas/UsageTotals'
        changes:
          $ref: '#/components/schemas/CodeChanges'
        changedFiles:
          type: array
          items:
            $ref: '#/components/schemas/ChangedFile'

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    WorkspaceFolder:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
